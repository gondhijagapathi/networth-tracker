# The front end, and the only door to the API.
#
# This is the containerised twin of the nginx block in docs/DEPLOYMENT.md, with two
# differences that follow from running in compose: it listens on plain HTTP, because TLS is
# terminated by whatever proxy the operator puts in front of the stack, and it proxies to
# the `api` service by name rather than to a loopback port.
#
# The API container publishes no port of its own. Everything reaches it through here, which
# is what makes the single trusted proxy hop the API assumes actually true.

# Pass an outer proxy's scheme through when there is one, and fall back to our own when
# there is not — so the header is never forwarded empty. Express only consults it via
# `trust proxy`; whether cookies carry the `Secure` flag is decided by `COOKIE_SECURE`,
# not by this.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A backup bundle is the whole installation in one file, and a restore uploads one.
  client_max_body_size 512M;

  # Compress the shell. Not the API: those responses are somebody's financial position, and
  # compressing a response that carries a session is the shape of the BREACH attack.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # A restore rewrites the database and every upload blob. It is slow on purpose.
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_request_buffering off;
  }

  # Hashed filenames, so these are immutable and may be cached hard.
  #
  # Matched on the extension rather than on the `/assets/` prefix, because the app also has
  # routes under that path — `/assets/new`, `/assets/<id>`, `/assets/<id>/edit`. A prefix
  # block here has no `try_files`, so a reload or a deep link to any of them looked for a
  # file of that name and answered 404 instead of the app. Only real build output matches
  # this; everything else falls through to the single-page fallback below.
  location ~* ^/assets/.+\.(js|mjs|css|map|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cached: the browser has to be able to pick up a new deploy, and the service worker
  # revalidates the document on every navigation.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # A single-page app: an unknown path is a route, not a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
