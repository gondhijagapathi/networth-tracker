name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Separate from `verify` because it costs a browser download, and because a flake here
    # should be visibly a flake in the browser rather than a red mark against the unit tests.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run test:e2e:install

      # The API's dev server runs from source with tsx, but it imports @networth/shared by
      # its built entry point like any other consumer would, so that one workspace has to
      # be compiled first — the web and api dev servers themselves do not need a build.
      - name: Build shared package
        run: npm run build -w @networth/shared

      # The suite stands up its own API and web server against a throwaway database in the
      # system temp directory, so there is nothing to provision here.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  guard:
    name: Secret & data guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fail if secrets or data files are tracked
        run: |
          offenders=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.(db|sqlite|sqlite3)$|^data/' \
            | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Tracked files match a secret or data pattern; these must never be committed:"
            echo "$offenders"
            exit 1
          fi
          echo "Clean — no tracked secrets or data files."
