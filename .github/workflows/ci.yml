name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  guard:
    name: Secret & data guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fail if secrets or data files are tracked
        run: |
          offenders=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.(db|sqlite|sqlite3)$|^data/' \
            | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Tracked files match a secret or data pattern; these must never be committed:"
            echo "$offenders"
            exit 1
          fi
          echo "Clean — no tracked secrets or data files."
