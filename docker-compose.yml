# Net Worth Tracker — the whole installation.
#
#     cp .env.example .env      # then fill in the secrets, as in docs/DEPLOYMENT.md
#     mkdir -p data
#     docker compose up -d --build            # build from this checkout
#     docker compose pull && docker compose up -d --no-build   # or run published images
#
# All state lives in ./data next to this file — database, uploads and backup bundles. There
# is no named volume: what the application owns is a directory you can see.
#
# Two containers: the Node API and an nginx that serves the front end and is the only route
# to the API. Nothing else — no database server, no Redis, no queue.
#
# This listens on plain HTTP on 127.0.0.1:8080. Put your own TLS proxy in front of it and
# set COOKIE_SECURE=true; see "Behind a reverse proxy" in docs/DEPLOYMENT.md.

services:
  api:
    # Two ways in. A release install sets NETWORTH_IMAGE_API to a published tag and never
    # builds — `deploy.sh` passes `--no-build` there, so the `build:` block below is inert
    # and the source tree it points at does not have to exist. Building from a checkout is
    # the other way, and then the default local tag is what gets built.
    image: ${NETWORTH_IMAGE_API:-networth-api:local}
    build:
      context: .
      target: api
    restart: unless-stopped

    # Secrets come from .env at run time. They are deliberately not build arguments: an
    # image layer is readable by anyone who can pull the image.
    env_file: .env

    # These override anything .env says, and they have to. The paths in .env describe the
    # host filesystem for a bare-metal install; inside the container everything lives under
    # /data, which is the directory bind-mounted below, and the server has to bind beyond
    # loopback for nginx to reach it.
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_PATH: /data/networth.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      # Pinned, not taken from .env, and not substitutable. `.env.example` ships `false`
      # because that is right for `npm run dev` over plain HTTP — but this stack always sets
      # NODE_ENV=production, which requires it to be true, so a copied .env would otherwise
      # crash-loop the container on a first run with the reason buried in `docker logs`.
      #
      # True is also simply correct for every way this stack is meant to be reached: the
      # published port is loopback, and browsers treat localhost as a secure context and
      # accept the cookie; anything else is behind the TLS proxy the docs require.
      COOKIE_SECURE: 'true'
      # Cron expressions match local time. Without this the nightly backup runs at 02:00 UTC.
      TZ: ${TZ:-Asia/Kolkata}
      # Where links in outgoing email point. Passed straight through, empty included: the
      # server reads an empty value as unset and falls back to the first CORS_ORIGIN, which
      # is the origin a browser actually reaches this stack on. Defaulting it here to a
      # localhost URL instead would override that fallback with the wrong answer on every
      # install behind a reverse proxy.
      APP_BASE_URL: ${APP_BASE_URL:-}

    # The image runs as `node` (uid 1000). A bind mount keeps whatever ownership the host
    # directory already has, so the container is told to run as the user who owns it —
    # otherwise the server cannot write its own database, and every file it did write would
    # need root to delete. deploy.sh puts the invoking user's ids here.
    user: '${NETWORTH_UID:-1000}:${NETWORTH_GID:-1000}'

    volumes:
      # The database, the encrypted upload blobs and the backup bundles — a plain directory
      # on the host, next to this file, so it can be listed, copied and deleted without
      # going through Docker. This is the one thing in this file worth backing up.
      - ${NETWORTH_DATA_DIR:-./data}:/data

    # No `ports`. The API is reachable only from the compose network, which is what makes
    # the single trusted proxy hop it assumes actually true.
    expose:
      - '4000'

  web:
    image: ${NETWORTH_IMAGE_WEB:-networth-web:local}
    build:
      context: .
      target: web
    restart: unless-stopped

    ports:
      # Loopback by default. Set NETWORTH_BIND=0.0.0.0 ONLY when a TLS proxy on another host
      # is what reaches this — never to expose it directly.
      #
      # Its own variables rather than reusing WEB_PORT, which .env sets to the Vite dev
      # server's port and which has nothing to do with where this stack is published.
      - '${NETWORTH_BIND:-127.0.0.1}:${NETWORTH_HTTP_PORT:-8080}:80'

    depends_on:
      api:
        # nginx resolves upstream names at startup, so it needs the API to exist before it
        # boots — not merely to have been created.
        condition: service_healthy
